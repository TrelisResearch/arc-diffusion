[project]
name = "arc-diffusion"
version = "0.1.0"
description = "ARC Diffusion Model for Abstract Reasoning Challenge"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "utils"]
